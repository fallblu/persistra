[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "persistra"
version = "4.0.0"
description = "Primary financial data and quantitative research"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "James Mallette", email = "jamesmallmw@gmail.com" }]
keywords = [
    "backtesting",
    "economic-data",
    "finance",
    "market-data",
    "portfolio-analysis",
    "quantitative-research",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.5,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "platformdirs>=4.3,<5",
    "requests>=2.32,<3",
]

[project.urls]
Documentation = "https://github.com/fallblu/persistra/blob/main/docs/index.md"
Issues = "https://github.com/fallblu/persistra/issues"
Repository = "https://github.com/fallblu/persistra"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.88,<7",
    "jsonschema[format-nongpl]>=4.23,<5",
    "pandas-stubs>=3,<4",
    "pre-commit>=4,<5",
    "pyright==1.1.410",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
]

[dependency-groups]
dev = ["persistra[dev]"]
docs = ["persistra[docs]"]

[tool.hatch.build.targets.wheel]
packages = ["src/persistra"]

[tool.hatch.build]
exclude = [
    "/.uv-cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.pyright",
    "/.venv",
    "/coverage.xml",
    "/dist",
    "/site",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --cov=persistra --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = [
    "contract: normalized family contract tests",
    "live: opt-in tests that call Alpha Vantage",
]

[tool.coverage.run]
source = ["persistra"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
