[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "persistra"
version = "4.2.0"
description = "Point-in-time financial research toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Mallette", email = "jamesmallmw@gmail.com" }]
keywords = [
    "backtesting",
    "economic-data",
    "finance",
    "market-data",
    "portfolio-analysis",
    "quantitative-research",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.5,<2",
    "jsonschema[format-nongpl]>=4.23,<5",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "platformdirs>=4.3,<5",
    "pyarrow>=25,<26",
    "requests>=2.33,<3",
    "referencing>=0.36,<1",
    "scipy>=1.17,<2",
    "tzdata>=2025.2",
]

[project.urls]
Changelog = "https://github.com/fallblu/persistra/blob/main/CHANGELOG.md"
Documentation = "https://fallblu.github.io/persistra/"
Homepage = "https://fallblu.github.io/persistra/"
Issues = "https://github.com/fallblu/persistra/issues"
Source = "https://github.com/fallblu/persistra"

[project.scripts]
persistra = "persistra._cli:main"

[project.optional-dependencies]
viz = [
    "plotly>=6.9,<7",
]
inspect = [
    "panel>=1.9.3,<2",
    "plotly>=6.9,<7",
]
dev = [
    "hypothesis>=6.88,<7",
    "pandas-stubs>=3,<4",
    "pre-commit>=4,<5",
    "pyright==1.1.411",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6,<10",
    "mkdocstrings[python]>=0.30,<1",
    "pymdown-extensions>=11.0.1,<12",
]
portfolio-solver = [
    "cvxpy[scip]>=1.9,<2",
]

[dependency-groups]
dev = ["persistra[dev,inspect,portfolio-solver]"]
docs = ["persistra[docs]"]

[tool.hatch.build.targets.wheel]
packages = ["src/persistra"]

[tool.hatch.build]
exclude = [
    "/.uv-cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.pyright",
    "/.venv",
    "/coverage.xml",
    "/dist",
    "/site",
]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/docs",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --cov=persistra --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = [
    "contract: normalized family contract tests",
    "live: opt-in tests that call Alpha Vantage",
]

[tool.coverage.run]
source = ["persistra"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
