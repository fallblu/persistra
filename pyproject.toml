[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "persistra"
version = "3.0.1"
description = "Point-in-time market research and event-driven backtesting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "James Mallette", email = "jamesmallmw@gmail.com" }]
keywords = ["backtesting", "finance", "market-data", "quantitative-research"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cvxpy>=1.5.2,<2",
    "duckdb>=1.5,<2",
    "exchange-calendars>=4.13,<5",
    "jinja2>=3.1,<4",
    "numpy>=2,<3",
    "optuna>=4,<5",
    "pandas>=3,<4",
    "plotly>=6,<7",
    "pytz>=2025,<2027",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "sqlglot>=30,<31",
    "streamlit>=1.30,<2",
    "structlog>=25,<26",
]

[project.urls]
Documentation = "https://github.com/fallblu/persistra/tree/main/docs"
Issues = "https://github.com/fallblu/persistra/issues"
Repository = "https://github.com/fallblu/persistra"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.88,<7",
    "pandas-stubs>=3,<4",
    "pre-commit>=4,<5",
    "pyright==1.1.410",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
]

[project.scripts]
persistra = "persistra.cli:main"

[dependency-groups]
dev = ["persistra[dev]"]
docs = ["persistra[docs]"]

[tool.hatch.build.targets.wheel]
packages = ["src/persistra"]

[tool.hatch.build]
exclude = [
    "/.uv-cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.pyright",
    "/.venv",
    "/coverage.xml",
    "/dist",
    "/site",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --cov=persistra --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
markers = [
    "integration: tests involving managed external boundaries",
    "contract: family and provider conformance contract tests",
    "contract_id: normative V3 requirement identifier(s) a test covers",
    "property: generative invariant tests",
    "scenario: end-to-end domain scenarios",
    "fault: failure-injection and recovery tests",
    "multiprocess: process and lease tests",
    "browser: dashboard browser tests",
]

[tool.coverage.run]
source = ["persistra"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests/contracts", "tests/fixtures"]
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
