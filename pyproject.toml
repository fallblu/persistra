[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "persistra"
version = "2.0.0"
description = "Point-in-time market research and event-driven backtesting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "James Mallette", email = "jamesmallmw@gmail.com" }]
dependencies = [
    "duckdb>=1.5,<2",
    "exchange-calendars>=4.13,<5",
    "pandas>=3,<4",
    "pytz>=2025,<2027",
    "structlog>=25,<26",
]

[project.optional-dependencies]
base = []
research = [
    "numpy>=2,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "sqlglot>=30,<31",
]
search = ["optuna>=4,<5"]
optimize = ["cvxpy>=1,<2"]
viz = ["jinja2>=3.1,<4", "plotly>=6,<7"]
dashboard = ["persistra[viz]", "streamlit>=1,<2"]
all = [
    "persistra[dashboard,optimize,research,search]",
]
static = []
dev = [
    "hypothesis>=6,<7",
    "pandas-stubs>=3,<4",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
]

[project.scripts]
persistra = "persistra.cli:main"

[dependency-groups]
dev = ["persistra[dev]"]
docs = ["persistra[docs]"]

[tool.hatch.build.targets.wheel]
packages = ["src/persistra"]

[tool.hatch.build]
exclude = [
    "/.uv-cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.pyright",
    "/.venv",
    "/coverage.xml",
    "/dist",
    "/site",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=persistra --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
markers = [
    "integration: tests involving managed external boundaries",
    "contract: family and provider conformance contract tests",
    "contract_id: normative V3 requirement identifier(s) a test covers",
    "property: generative invariant tests",
    "scenario: end-to-end domain scenarios",
    "fault: failure-injection and recovery tests",
    "multiprocess: process and lease tests",
    "performance: resource and benchmark tests",
    "browser: dashboard browser tests",
    "compatibility: supported dependency and Python matrix tests",
]

[tool.coverage.run]
source = ["persistra"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests/contracts", "tests/fixtures"]
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
