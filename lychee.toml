# External links are network-sensitive and run only in the External links workflow.
verbose = "info"
format = "detailed"
no_progress = true

threads = 2
max_concurrency = 4
host_concurrency = 2
max_redirects = 5
max_retries = 2
timeout = 20
retry_wait_time = 2

scheme = ["https"]
require_https = true
insecure = false
exclude_all_private = true
include_mail = false

# Add only exact, reviewed URL patterns that cannot be made checkable. Broad host exclusions
# are not acceptable, and every addition must explain the unavoidable failure in its PR.
exclude = []
