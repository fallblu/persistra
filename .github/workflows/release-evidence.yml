name: Release evidence

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/release-evidence.yml"
      - "Makefile"
      - "pyproject.toml"
      - "scripts/build_release_evidence.py"
      - "scripts/check_release.py"
      - "tests/unit/test_packaging.py"
      - "tests/unit/test_release_evidence.py"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --group release-evidence
      - run: uv run pytest --no-cov tests/unit/test_packaging.py tests/unit/test_release_evidence.py

  attest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --group release-evidence
      - name: Require an exact release source ref
        run: uv run python scripts/check_release.py --source-ref "$GITHUB_REF"
      - run: make release-evidence
      - id: provenance
        name: Sign SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-evidence/subjects.sha256
      - id: sbom
        name: Sign CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-evidence/subjects.sha256
          sbom-path: release-evidence/persistra.cdx.json
      - name: Retain portable Sigstore bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" release-evidence/provenance.sigstore.json
          cp "$SBOM_BUNDLE" release-evidence/sbom.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/*
          if-no-files-found: error
          retention-days: 90
