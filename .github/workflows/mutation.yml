name: Mutation testing

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/mutation.yml"
      - "Makefile"
      - "mutation-baseline.toml"
      - "pyproject.toml"
      - "scripts/check_mutation.py"
      - "src/persistra/integrations/trading_engine/initial_state.py"
      - "src/persistra/model/_frames.py"
      - "src/persistra/portfolio/construction.py"
      - "src/persistra/research/splits.py"
      - "tests/contracts/test_frames.py"
      - "tests/contracts/test_result_coherence.py"
      - "tests/unit/integrations/test_trading_engine_initial_state.py"
      - "tests/unit/portfolio/test_construction.py"
      - "tests/unit/research/test_labels_splits.py"
      - "uv.lock"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  financial-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --group mutation
      - run: make mutation
