name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --group docs
      - run: uv lock --check
      - run: make lint type test docs-check
      - run: make docs-build
      - run: make schema-check
      - run: make benchmark-smoke

  dependency-bands:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv .venv-compat
      - run: >-
          uv pip install --python .venv-compat/bin/python
          --resolution "${{ matrix.resolution }}" ".[dev,docs]"
      - run: .venv-compat/bin/python -m pytest --no-cov

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv build
      - run: uv venv .venv-package
      - run: uv pip install --python .venv-package/bin/python dist/*.whl
      - run: .venv-package/bin/python -c "import persistra; import persistra.dashboard"
      - run: .venv-package/bin/persistra project init package-smoke
      - run: .venv-package/bin/persistra project inspect package-smoke
