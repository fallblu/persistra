name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (dev extra)
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest (with coverage gate)
        run: uv run pytest

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project (dev and docs extras)
        run: uv sync --frozen --python 3.12 --extra dev --extra docs

      - name: Check documentation snippets
        run: uv run python scripts/check_doc_snippets.py

      - name: Build documentation
        run: uv run mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Create smoke-test environment
        run: uv venv --python 3.12 .venv-smoke

      - name: Install built wheel
        run: uv pip install --python .venv-smoke/bin/python dist/*.whl

      - name: Smoke import installed package
        run: .venv-smoke/bin/python -c "import persistra; print(persistra.__version__); assert persistra.__version__"
