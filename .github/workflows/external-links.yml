name: External links

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/external-links.yml
      - lychee.toml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --verbose --no-progress
            'README.md' 'docs/**/*.md'
          checkbox: false
          fail: true
          failIfEmpty: true
          format: detailed
          jobSummary: false
          lycheeVersion: v0.24.2
          output: lychee-report.txt
          token: ""
