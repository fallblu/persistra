site_name: Persistra
site_description: Research, construct, and replay systematic trading strategies
site_url: https://fallblu.github.io/persistra/
repo_url: https://github.com/fallblu/persistra
repo_name: fallblu/persistra
edit_uri: edit/develop/docs/
theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Create a project: guides/projects.md
      - Strategy quickstart: getting-started/quickstart.md
      - Set up Trading Engine: getting-started/trading-engine.md
      - Connect Alpha Vantage: getting-started/alpha-vantage.md
      - Connect FRED and ALFRED: getting-started/fred.md
  - Strategy development:
      - Develop a strategy: guides/strategy-development.md
      - Build factor models: guides/research.md
      - Optimize portfolios: guides/portfolio.md
      - Replay with Trading Engine: guides/trading-engine.md
  - How-to guides:
      - Acquire data: guides/acquisition.md
      - Work offline and manage the cache: guides/cache-offline.md
      - Store and query results: guides/storage.md
      - Inspect local stores: guides/inspection.md
      - Reshape and align data: guides/transforms.md
      - Build point-in-time datasets: guides/research.md
      - Construct and backtest portfolios: guides/portfolio.md
      - Analyze observations: guides/analysis.md
      - Build visualizations: guides/visualization.md
      - Handle errors: guides/errors.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Data model: concepts/data-model.md
      - Time and provenance: concepts/time-provenance.md
      - Documentation platform: concepts/documentation-platform.md
  - Examples:
      - Choose an example: examples/index.md
      - Data and features: examples/data-and-features.md
      - Factor models: examples/factor-models.md
      - Portfolio optimization: examples/portfolio-optimization.md
      - Strategy lifecycle: examples/strategy-lifecycle.md
      - Composite strategies: examples/composite-strategies.md
      - Trading Engine replay: examples/trading-engine-replay.md
      - Analysis and visualization: examples/analysis-and-visualization.md
  - API reference:
      - Overview: reference/index.md
      - Models: reference/model.md
      - Data access and storage: reference/data.md
      - Alpha Vantage: reference/alphavantage.md
      - FRED and ALFRED: reference/fred.md
      - Analysis: reference/analysis.md
      - Point-in-time research: reference/research.md
      - Portfolio research: reference/portfolio.md
      - Projects: reference/project.md
      - Trading Engine integration: reference/trading-engine.md
      - Visualization: reference/visualization.md
      - Normalized schemas: reference/schemas.md
      - Exceptions: reference/errors.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
strict: true
