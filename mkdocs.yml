site_name: Persistra
site_description: Primary financial data and quantitative research
theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
nav:
  - Home: index.md
  - Release assurance: release-assurance.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Connect Alpha Vantage: getting-started/alpha-vantage.md
      - Connect FRED and ALFRED: getting-started/fred.md
  - Tutorials:
      - Compare markets: tutorials/market-research.md
      - Explore historical options: tutorials/options-research.md
      - Study economic series: tutorials/economic-research.md
  - How-to guides:
      - Acquire data: guides/acquisition.md
      - Work offline and manage the cache: guides/cache-offline.md
      - Store and query results: guides/storage.md
      - Reshape and align data: guides/transforms.md
      - Build point-in-time datasets: guides/research.md
      - Construct and backtest portfolios: guides/portfolio.md
      - Analyze observations: guides/analysis.md
      - Build visualizations: guides/visualization.md
      - Handle errors: guides/errors.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Ecosystem boundaries: concepts/ecosystem-boundaries.md
      - Data model: concepts/data-model.md
      - Time and provenance: concepts/time-provenance.md
  - Examples:
      - Snippet cookbook: examples/snippets.md
  - API reference:
      - Overview: reference/index.md
      - Models: reference/model.md
      - Data access and storage: reference/data.md
      - Alpha Vantage: reference/alphavantage.md
      - FRED and ALFRED: reference/fred.md
      - Analysis: reference/analysis.md
      - Point-in-time research: reference/research.md
      - Portfolio research: reference/portfolio.md
      - Visualization: reference/visualization.md
      - Normalized schemas: reference/schemas.md
      - Exceptions: reference/errors.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
strict: true
