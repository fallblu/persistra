site_name: Persistra
site_description: Point-in-time market research and simulation
theme:
  name: material
nav:
  - Home: index.md
  - Reference:
      - API overview: reference/api/index.md
      - CLI: reference/cli.md
      - Metric catalog: reference/metric-catalog.md
      - Export formats: reference/export-formats.md
      - API namespaces:
          - persistra: reference/api/persistra.md
          - domain: reference/api/domain.md
          - catalog: reference/api/catalog.md
          - reference data: reference/api/reference.md
          - market: reference/api/market.md
          - sources: reference/api/sources.md
          - research: reference/api/research.md
          - portfolio: reference/api/portfolio.md
          - accounting: reference/api/accounting.md
          - simulation: reference/api/simulation.md
          - experiments: reference/api/experiments.md
          - results: reference/api/results.md
          - analysis: reference/api/analysis.md
          - viz: reference/api/viz.md
          - reports: reference/api/reports.md
          - dashboard: reference/api/dashboard.md
          - conformance: reference/api/conformance.md
          - flagship: reference/api/flagship.md
          - errors: reference/api/errors.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
strict: true
