site_name: Persistra
site_description: Primary market and economic data research
theme:
  name: material
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Data model and storage: data-model.md
  - Alpha Vantage acquisition: acquisition.md
  - Analysis and visualization: analysis.md
  - Examples:
      - Cross-asset research: notebooks/01-cross-asset.ipynb
      - Historical options: notebooks/02-historical-options.ipynb
  - API reference: reference/api.md
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
strict: true
