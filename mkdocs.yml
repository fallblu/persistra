site_name: persistra
site_description: Tooling for market research, strategy development, and event-driven backtesting.
theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight
  - pymdownx.snippets
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            members_order: source
  - mkdocs-jupyter:
      execute: false
      include_source: true
nav:
  - Home: index.md
  - V3 Planning:
      - Umbrella Specification: v3-spec.md
      - Domain Primitives: v3/01-domain-identity-time-money-events.md
      - Project and Databases: v3/02-project-databases-leases-copies-migrations.md
      - Catalog and Ingestion: v3/03-catalog-ingestion-quarantine-snapshots.md
      - Reference Data and Universes: v3/04-reference-identifiers-calendars-universes.md
      - Market Data and Adjustments: v3/05-market-bars-trades-quotes-actions-adjustments.md
      - Fundamentals and Economic Data: v3/06-fundamentals-estimates-macro-benchmarks-rates.md
      - Research Datasets and Workspaces: v3/07-research-datasets-temporal-joins-sql-workspaces-safety.md
      - Features, Labels, and Conformance: v3/08-features-labels-bounded-execution-temporal-conformance-provenance.md
      - Alpha Diagnostics and Validation: v3/09-alpha-diagnostics-finance-aware-validation.md
      - Signals, Forecasts, and Optimization: v3/10-signals-forecasts-risk-models-constraints-optimization.md
  - Getting Started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - First Backtest: getting-started/first-backtest.md
  - Guides:
      - Write a Strategy: guides/write-a-strategy.md
      - Built-In Strategies: guides/built-in-strategies.md
      - Pipeline and Risk: guides/pipeline-and-risk.md
      - Metrics and Plots: guides/metrics-and-plots.md
      - Save and Load Runs: guides/save-and-load-runs.md
  - Research Workflows:
